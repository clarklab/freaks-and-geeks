<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7b1e22" />
  <title>Freaks & Geeks — Clark & Angie's Ratings</title>
  <meta name="description" content="Rate every Freaks and Geeks episode together, offline." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="F&G Ratings" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1>Freaks <span>&amp;</span> Geeks</h1>
      <span id="offline-chip" class="chip" title="Saved to this device for offline use">saving…</span>
    </div>
    <p class="subtitle">Clark &amp; Angie rate the whole season</p>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="episodes" role="tab">Episodes</button>
      <button class="tab" data-view="ranking" role="tab">Ranking</button>
    </nav>
    <div id="progress" class="progress"></div>
  </header>

  <main id="app"></main>

  <footer class="foot">
    <span>18 episodes · one perfect season</span>
    <button id="reset-btn" class="linkbtn">Reset all ratings</button>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
