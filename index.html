<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5d161a" />
  <title>Freaks & Geeks — Clark & Angie's Ratings</title>
  <meta name="description" content="Rate every Freaks and Geeks episode together, offline." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="F&G Ratings" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8L12 2.5z"/>
            </svg>
          </span>
          <div class="brand-text">
            <h1>Freaks <em>&amp;</em> Geeks</h1>
            <p class="subtitle">Clark <span>&amp;</span> Angie rate the whole season</p>
          </div>
        </div>
        <span id="offline-chip" class="chip" title="Saved to this device for offline use">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="chip-label">saving…</span>
        </span>
      </div>

      <nav class="tabs" role="tablist" aria-label="Views">
        <button class="tab is-active" data-view="episodes" role="tab" aria-selected="true">
          <span class="tab-label">Episodes</span>
        </button>
        <button class="tab" data-view="ranking" role="tab" aria-selected="false">
          <span class="tab-label">Ranking</span>
        </button>
        <span class="tabs-indicator" aria-hidden="true"></span>
      </nav>

      <div class="progress-wrap" aria-live="polite">
        <div class="progress-track" aria-hidden="true">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress" class="progress-text"></div>
      </div>
    </div>
  </header>

  <main id="app" class="isolate"></main>

  <footer class="foot">
    <span>18 episodes · one perfect season</span>
    <button id="reset-btn" class="linkbtn" type="button">Reset all ratings</button>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
