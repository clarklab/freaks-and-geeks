<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5d161a" />
  <title>Freaks & Geeks — Clark & Angie's Ratings</title>
  <meta name="description" content="Rate every Freaks and Geeks episode together, offline." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="F&G Ratings" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <div class="brand-text">
          <h1>Freaks <span class="amp">&amp;</span> Geeks</h1>
          <p class="subtitle">Clark &amp; Angie rate the whole season</p>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Views">
        <button class="tab is-active" data-view="episodes" role="tab" aria-selected="true">
          <span class="tab-label">Episodes</span>
        </button>
        <button class="tab" data-view="ranking" role="tab" aria-selected="false">
          <span class="tab-label">Ranking</span>
        </button>
        <span class="tabs-indicator" aria-hidden="true"></span>
      </nav>
    </div>
  </header>

  <main id="app" class="isolate"></main>

  <div id="lightbox" class="lightbox" hidden aria-hidden="true" role="dialog" aria-label="Episode still">
    <button class="lightbox-close" type="button" aria-label="Close">
      <span class="material-symbols-rounded">close</span>
    </button>
    <button class="lightbox-nav prev" type="button" aria-label="Previous">
      <span class="material-symbols-rounded">chevron_left</span>
    </button>
    <button class="lightbox-nav next" type="button" aria-label="Next">
      <span class="material-symbols-rounded">chevron_right</span>
    </button>
    <figure class="lightbox-figure">
      <img class="lightbox-img" alt="" />
      <figcaption class="lightbox-caption"></figcaption>
    </figure>
  </div>

  <footer class="foot">
    <div class="foot-left">
      <span class="foot-tag">18 episodes · one perfect season</span>
      <span id="offline-chip" class="chip" title="Saved to this device for offline use">
        <span class="chip-dot" aria-hidden="true"></span>
        <span class="chip-label">saving…</span>
      </span>
    </div>
    <button id="reset-btn" class="linkbtn" type="button">Reset all ratings</button>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
